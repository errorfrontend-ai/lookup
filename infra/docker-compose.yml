# Local development stack. Credentials below are for local development only.
# Step 1 (foundations): postgres + valkey. Object storage for ad uploads is added in step 2.
# Ports bind to 127.0.0.1 only, so nothing here is reachable from the local network.
name: lookup

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lookup
      POSTGRES_USER: lookup            # local superuser: creates roles and runs migrations only, never the app
      POSTGRES_PASSWORD: ${LOOKUP_DEVELOPMENT_DATABASE_PASSWORD:-lookup_development_only}
    ports:
      # High port: 5432/5433 are often taken by other local projects.
      - "127.0.0.1:${LOOKUP_DEVELOPMENT_DATABASE_PORT:-55432}:5432"
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lookup -d lookup"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    # Key-value store for job queues (API ⇄ fingerprint worker), rate limits and short-lived codes.
    # noeviction + append-only file are what BullMQ needs to never lose or silently drop jobs;
    # Render Key Value offers the same settings on paid plans. A password even locally, so the API
    # and worker are always built for an authenticated store.
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction",
              "--requirepass", "${LOOKUP_DEVELOPMENT_KEY_VALUE_PASSWORD:-lookup_key_value_development_only}"]
    ports:
      - "127.0.0.1:${LOOKUP_DEVELOPMENT_KEY_VALUE_PORT:-56379}:6379"
    volumes:
      - key-value-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "--no-auth-warning",
             "-a", "${LOOKUP_DEVELOPMENT_KEY_VALUE_PASSWORD:-lookup_key_value_development_only}", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  object-storage:
    # S3-compatible storage standing in for Cloudflare R2 (Step 2 uploads). versitygw validates presigned
    # URL signatures and per-bucket CORS, so tests exercise the real security properties. MinIO's
    # community images can no longer be pulled (2025-2026), hence this choice. Pinned by digest.
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    environment:
      ROOT_ACCESS_KEY: ${LOOKUP_DEVELOPMENT_OBJECT_STORAGE_ACCESS_KEY:-lookup_development_only}
      ROOT_SECRET_KEY: ${LOOKUP_DEVELOPMENT_OBJECT_STORAGE_SECRET_KEY:-lookup_object_storage_development_only}
      VGW_BACKEND: posix
      VGW_BACKEND_ARGS: /data/objects
      VGW_PORT: ":7070"
      VGW_HEALTH: /health
    ports:
      - "127.0.0.1:${LOOKUP_DEVELOPMENT_OBJECT_STORAGE_PORT:-59000}:7070"
    volumes:
      # A named volume (ext4 inside Docker's VM) supports the extended attributes versitygw stores metadata in.
      - object-storage-data:/data/objects
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7070/health"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  database-data:
  key-value-data:
  object-storage-data:
