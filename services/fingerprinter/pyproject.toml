[project]
name = "lookup-fingerprint"
version = "0.1.0"
description = "Look Up audio fingerprinting core, matcher workers and the Phase 0 benchmark harness"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1",
  "scipy>=1.14",
  "av>=14",            # PyAV: decodes AAC/Opus/MP3/WAV with bundled ffmpeg libs (no system ffmpeg needed)
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lookup_fingerprint*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
